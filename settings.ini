# SageTV minimal-custom FFmpeg build settings.
# FFmpeg is patched ONLY for runtime videorateadapt support.
FFMPEG_TAG=n9.0.1
BUILD_JOBS=0

# ONE reusable Docker image loaded into Docker Desktop.
SAGETV_BUILDER_IMAGE=sagetv-ffmpeg-mim-builder:9.0.1-v5
# ONE named runtime container is used for Linux-only, Windows-only, or all-target builds.
SAGETV_BUILDER_CONTAINER=sagetv-ffmpeg-mim-builder
SAGETV_BUILDX_NAME=sagetv-ffmpeg-mim-bootstrap

# Actual BtbN images used as REMOTE BuildKit stages. The bootstrap script does
# not docker pull/tag these into the normal Docker image store.
BTBN_BASE_IMAGE=ghcr.io/btbn/ffmpeg-builds/base:latest
BTBN_LINUX_IMAGE=ghcr.io/btbn/ffmpeg-builds/linux64-gpl-9.0:latest
BTBN_WINDOWS_X64_IMAGE=ghcr.io/btbn/ffmpeg-builds/win64-gpl-9.0:latest

# 0 = remove the private BuildKit bootstrap cache after the unified image loads.
KEEP_BOOTSTRAP_CACHE=0
# 0 = remove BtbN image tags left by older package versions.
KEEP_BTBN_IMAGES=0
