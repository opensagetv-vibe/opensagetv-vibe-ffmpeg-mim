; SageTV FFmpeg Native MIM configuration
; Target wrapper names:
;   Linux : ffmpeg -> ffmpeg.real
;   Win64 : SageTVTranscoder.exe -> ffmpeg.real.exe
;
; Merge modes used below:
;   inherit  = keep SageTV's value if present; use INI value only if missing
;   override = remove SageTV's existing option/value and use the INI value
;   append   = keep SageTV's option and append the INI argument(s)
;   remove   = strip the option from the command sent to real FFmpeg
;
; SageTV-only options such as -stdinctrl and -activefile are consumed by the MIM
; and are not passed to an unmodified FFmpeg binary.

[general]
enabled=true
; passthrough = preserve SageTV command unless a trigger matches
; always      = always rebuild/merge the FFmpeg command through this INI
mode=passthrough

; Detect SageTV's normal transcoder request. The current Linux HW script uses
; -vcodec mpeg4 as its hardware-transcode trigger.
hardware_trigger_option=-vcodec
hardware_trigger_value=mpeg4
; CSV list. A matching SageTV output codec activates hardware transcoding.
hardware_trigger_values=mpeg4,mpeg2video,h264,libx264,libopenh264,hevc,h265,libx265

; If SageTV requests this output format, use stream copy rather than HW transcode.
copy_only_format_trigger=dvd

; Core v0.3 policy: recognized SageTV jobs stream-copy unless a hardware trigger matches.
; copy | passthrough
default_sagetv_action=copy

; Keep unknown SageTV/FFmpeg options unless explicitly removed/overridden.
preserve_unknown_args=true



[transcode_map]
; Core policy:
;   1) SageTV job with no mapped software-video encoder request -> stream copy.
;   2) SageTV asks for a software encoder -> translate to the same/compatible hardware family.
;   3) If the requested family has no usable hardware encoder, software is the last fallback.
;
; Legacy SageTV commonly asks for MPEG-4 Part 2. Modern GPU backends generally do not
; provide an equivalent encoder, so map that old compatibility request to H.264 hardware.
legacy_software=mpeg4,mpeg2video
legacy_target=h264

; Native software codec requests that have direct hardware equivalents.
h264_software=h264,libx264,libopenh264
hevc_software=hevc,h265,libx265

; Legacy/general trigger target when hardware_trigger_values is used.
trigger_target=h264

; If neither hardware nor the matching software fallback encoder exists:
; passthrough | copy
on_encoder_unavailable=passthrough

[copy_default]
; Default for recognized SageTV media jobs that do NOT match a transcode trigger.
; This is codec stream copy/remux, not a filesystem copy. SageTV's requested container,
; maps, timestamps and other safe demux/mux options are preserved.
video=true
audio=true

; Encoding/filter-only options (bitrate, GOP, B-frames, scale/video filters, audio
; resample/filter options, etc.) are stripped automatically because they conflict with copy.

[paths]
; Relative paths are resolved from the MIM executable directory.
linux_x64_ffmpeg=./ffmpeg.real
windows_x64_ffmpeg=.\ffmpeg.real.exe

; Optional ffprobe used for diagnostics/capability detection.
linux_x64_ffprobe=./ffprobe
windows_x64_ffprobe=.\ffprobe.exe

[platform]
; auto, linux-x64, windows-x64
force_platform=auto

[hardware]
; auto, qsv, nvenc, vaapi, amf, d3d12va, software
backend=auto

; If true, probe ffmpeg.real at startup and choose the first working backend.
auto_detect=true
; Comma-separated preference order. Unsupported entries are skipped. VAAPI is
; preferred on Linux because the commissioned Intel i915 host completed the
; exact seek/live stress stream while FFmpeg 9 h264_qsv reproducibly segfaulted
; on particular MPEG-2 frames. NVIDIA hosts skip VAAPI and select NVENC.
linux_preference=vaapi,qsv,nvenc,software
windows_preference=qsv,nvenc,amf,d3d12va,software

; Before selecting a Linux hardware encoder, run one bounded 64x64 encode and
; cache successful results by FFmpeg binary/backend/device. This catches a
; missing driver, oneVPL implementation, device permission, or NVIDIA runtime
; and falls through to the next backend/software before playback begins.
preflight_hardware_encode=true
preflight_timeout_ms=5000

; Hardware encode and hardware decode are independent in v0.4.0.
; QSV device initialization happens for QSV ENCODING even when this is false.
; false = software decode -> hardware encode (recommended first validation path)
; true  = hardware decode -> hardware filters/encode (validate with real recordings first)
hardware_decode=false
; Growing Live TV MPEG-TS files can begin before the QSV decoder has enough
; stable stream data. Keep QSV encoding but use software decode for -activefile.
active_file_hardware_decode=false
; Caption-preserving software decode avoids the unstable growing-file QSV
; decoder while retaining QSV encode for live and completed media.
active_file_hardware_encode=true
decode_fallback=software

; QSV/VAAPI Linux render node. For QSV the MIM emits the validated oneVPL form:
;   -init_hw_device qsv:hw,child_device=/dev/dri/renderD128
; When hardware_decode=true it additionally emits -hwaccel qsv,
; -hwaccel_device hw, and -hwaccel_output_format qsv.
linux_render_device=/dev/dri/renderD128

[active_file]
; SageTV -activefile is consumed by the MIM.
enabled=true
; stock_follow = translate to stock FFmpeg -follow 1
; proxy        = future native MIM growing-file proxy with dynamic size/seek support
; disabled     = strip -activefile and treat input as a completed file
strategy=stock_follow
poll_interval_ms=25

; Do not launch an active Live TV transcode until the growing TS contains a
; recognizable MPEG-2/H.264/HEVC video sequence header. This is content-driven
; and normally completes sooner than a fixed probe delay.
video_ready_gate=true
video_ready_timeout_ms=2500
video_ready_poll_ms=25
video_ready_scan_bytes=5000000
; Avoid redundant container auto-detection for SageTV's known live .ts inputs.
force_mpegts_demuxer=true

; `-follow 1` does not expose a true EOF while FFmpeg discovers streams. A
; 500-KB probe can see the MPEG-2 PID but miss its dimensions, causing FFmpeg
; to map audio only forever. This 5-MB/5-second bounded active probe was
; reproduced with the commissioned HDHomeRun 1080i stream and still avoids the
; unbounded/default completed-file duration probe.
probesize=5000000
analyzeduration=5000000

; When SageTV sends inactivefile, stop treating EOF as temporary.
handle_inactivefile=true
; stock_follow cannot be disabled dynamically in stock FFmpeg.
; terminate_child ends the transcode cleanly when SageTV marks the file inactive.
inactivefile_action=terminate_child

[stdinctrl]
; SageTV -stdinctrl is consumed by the MIM.
enabled=true
stop_commands=STOP,QUIT,Q
case_insensitive=true

; Stock FFmpeg cannot change every encoder's bitrate live. Options:
; ignore  = log and ignore videorateadapt
; restart = restart real FFmpeg at the new bitrate and mark TS discontinuity
videorateadapt_mode=forward

[safety]
; v0.4.4 crash/switch containment. ffmpeg.real is a disposable child process;
; SageTV and the MIM must never share its signal/process group. On Linux,
; -stdinctrl stdin EOF/HUP also terminates the isolated FFmpeg process group,
; normal MIM termination signals are converted to child cleanup, and a hard
; MIM death uses PR_SET_PDEATHSIG(SIGKILL) so ffmpeg.real cannot be orphaned.
isolate_child_process=true

; STOP/QUIT first send SIGTERM only to the FFmpeg process group. If FFmpeg or
; one of its helper descendants refuses to exit, escalate to SIGKILL after this
; many milliseconds. This never targets SageTV/Java.
terminate_grace_ms=2000

; Realtime SageTV (-stdinctrl) transcoder failures are normalized to a clean
; MIM exit. MiniPlayer sees EOF/no video instead of a failed transcoder process.
clean_exit_on_ffmpeg_failure=true

[input]
; These settings are adapted from SageTV_Linux_HW_FFMPEG.
probesize_mode=override
; Live ATSC MPEG-TS can begin between sequence headers. A larger maximum lets
; FFmpeg find video dimensions instead of incorrectly creating audio-only output.
probesize=524288
analyzeduration_mode=override
analyzeduration=500000

; Merge with SageTV's -fflags. The MIM should de-duplicate individual flags.
fflags_mode=append
; Keep startup fast, but allow FFmpeg to read ahead instead of exposing every
; short input/GPU timing gap directly to the MiniClient.
fflags=+genpts+discardcorrupt

; This packet queue fills concurrently after output starts; it is not a fixed
; startup delay. 8192 packets is a bounded cushion for growing Live TV files.
thread_queue_size_mode=override
thread_queue_size=8192

max_delay_mode=override
max_delay=500000

; Applied only to active MPEG-TS input when supported.
mpegts_resync_size=1048576

[probe_cache]
; Cache stream discovery so SageTV seek/restart does not repeat a full probe.
enabled=true
directory=cache/probe

; A warm cache still needs enough input packets for FFmpeg to preserve the
; initial A/53 caption cadence. 64 KiB / 100 ms caused VAAPI Fixed output to
; emit 0.5-second caption updates at half rate and accumulate ~5 seconds of
; drift while video and SageTV's timeline remained correct.
cached_probesize=524288
cached_analyzeduration=500000
cached_max_probe_packets=1024
skip_duration_probe=true

; Retained for compatibility with older INI files. Version 0.4.5+ deliberately
; bypasses the fast probe cache for active/growing files because an inode-only
; hit can miss audio or video when TS packet order differs at a later start.
ignore_size_change_for_active_file=true

[closed_captions]
; Preserve CEA-608/708 A/53 caption side data in H.264 where the encoder supports it.
preserve_a53cc=true
; GPU decoders can discard AV_FRAME_DATA_A53_CC. Keep input decode in software
; for every GPU encoder when caption preservation is enabled. Video filtering,
; upload, and encoding still use the selected QSV/VAAPI/NVENC backend.
caption_software_decode=true
; Intel MPEG-2 QSV decode drops A/53 frame side data. Decode and filter in
; software, then feed NV12 system-memory frames to the QSV encoder so captions
; survive transcoding without the low-headroom hwupload/scale_qsv live path.
; Retained as a backward-compatible QSV-specific override.
qsv_software_decode=true

[seek]
; Preserve SageTV's requested seek while giving completed broadcast MPEG-TS a
; bounded decoder preroll. A direct input seek can land between MPEG-2 sequence
; headers; FFmpeg 9/QSV was reproduced emitting only a short partial stream and
; then crashing. MIM seeks this many seconds earlier and discards the preroll
; after opening the input, so the MiniPlayer still receives the requested time.
seek_mode=inherit
; Compatibility workaround for decoder/GPU combinations that cannot start at
; SageTV's exact requested MPEG-TS position. Keep disabled by default: changing
; the hidden input seek by this amount can shift SageTV's reported timeline and
; A/53 caption presentation relative to the visible program.
completed_mpegts_preroll=false
completed_mpegts_preroll_seconds=5

; Optional faster remote-control skipping. false preserves FFmpeg accurate seek.
fast_seek=false

; If enabled later, a failed normal TS seek can retry backward to a video keyframe.
keyframe_fallback=true

; Log requested seek, input size, selected stream and fallback result.
seek_logging=true

[video]
; The script used hevc_qsv. H.264 is generally safer for MiniClient compatibility.
codec_mode=override
; H.264 family mapping.
codec_h264_qsv=h264_qsv
codec_h264_nvenc=h264_nvenc
codec_h264_vaapi=h264_vaapi
codec_h264_amf=h264_amf
codec_h264_d3d12va=h264_d3d12va
codec_h264_software=libx264

; HEVC family mapping. Used when SageTV asks for libx265/hevc/h265.
codec_hevc_qsv=hevc_qsv
codec_hevc_nvenc=hevc_nvenc
codec_hevc_vaapi=hevc_vaapi
codec_hevc_amf=hevc_amf
codec_hevc_d3d12va=hevc_d3d12va
codec_hevc_software=libx265

; Backward-compatible aliases retained for older INI files.
codec_auto_qsv=h264_qsv
codec_auto_nvenc=h264_nvenc
codec_auto_vaapi=h264_vaapi
codec_auto_amf=h264_amf
codec_auto_d3d12va=h264_d3d12va
codec_auto_software=libx264

; Preserve SageTV's requested bitrate (-b/-b:v) and derive rate-control limits.
bitrate_mode=inherit
maxrate_multiplier=1.5
bufsize_multiplier=3.0

; Adapted from GOP_CLAMP_MAX in ffmpeg.sh.
; 0 disables the clamp. 60 means SageTV -g values above 60 become 60.
gop_mode=clamp
gop_max=60

; For faster MiniClient recovery after FLUSH/skip.
bframes_mode=override
bframes=0

; Encoder preset. 'auto' maps to backend-specific defaults below.
preset_mode=override
preset=auto
preset_qsv=fast
preset_nvenc=p3
preset_vaapi=
preset_amf=speed
preset_d3d12va=
preset_software=veryfast

; Optional encoder-specific args appended after the MIM-generated video settings.
extra_qsv=
extra_nvenc=
extra_vaapi=
extra_amf=
extra_d3d12va=
extra_software=

[filters]
; v0.4.0 applies these QSV templates only when hardware_decode=true.
; With hardware_decode=false the normal software decode/filter/scale path is preserved.
; auto, on, off
deinterlace=auto

; Hardware filter templates adapted from the shell script.
; %w% and %h% are replaced by SageTV's -s WxH when supplied.
qsv_no_scale=deinterlace_qsv
qsv_scale=deinterlace_qsv,scale_qsv=w=%w%:h=%h%

; QSV encode after software decode accepts system-memory NV12 and performs its
; own upload. Keeping yadif/scale here in software is intentionally faster and
; more stable for growing 1080i MPEG-2 than a separate hwupload+scale_qsv chain.
qsv_software_no_scale=yadif=deint=interlaced,format=nv12
qsv_software_scale=yadif=deint=interlaced,scale=w=%w%:h=%h%,format=nv12

; Full NVDEC emits CUDA frames, so use CUDA-native filters. Software-decode to
; NVENC leaves SageTV's normal software filter/scale path unchanged.
nvenc_no_scale=yadif_cuda=deint=interlaced
nvenc_scale=yadif_cuda=deint=interlaced,scale_cuda=w=%w%:h=%h%

; Full VAAPI decode already produces hardware frames.
vaapi_no_scale=deinterlace_vaapi=auto=1
vaapi_scale=deinterlace_vaapi=auto=1,scale_vaapi=w=%w%:h=%h%

; VAAPI encoding after software decode requires an explicit upload. These
; templates keep deinterlacing in software, upload NV12 frames, then optionally
; scale using VAAPI.
vaapi_software_no_scale=yadif=deint=interlaced,format=nv12,hwupload
vaapi_software_scale=yadif=deint=interlaced,format=nv12,hwupload,scale_vaapi=w=%w%:h=%h%

software_no_scale=yadif
software_scale=yadif,scale=w=%w%:h=%h%

[compatibility]
; SageTV MiniPlayer fixed-push commands specify a container/audio contract that
; the server and client expect on the wire.  Keep those explicit values and
; allow the MIM to replace only the video encoder with the selected HW backend.
; This is intentionally true even if [audio] or [output] below request overrides.
preserve_sagetv_output_contract=true

[audio]
; Adapted from AUDIO_REENCODE.
; copy, ac3, inherit
mode=copy

; Used only when mode=ac3; inherit SageTV -ab/-ar/-ac when present.
codec=ac3
bitrate_mode=inherit
sample_rate_mode=inherit
channels_mode=inherit

; default = let FFmpeg choose; all = -map 0:v -map 0:a?
track_mode=all

[copy_only]
video_codec=copy
audio_codec=copy
output_format=mpegts
map_all_audio=true

[output]
format_mode=override
format=mpegts

; Low-latency TS behavior for SageTV PUSH MiniClient.
flush_packets_mode=override
flush_packets=1
muxpreload_mode=override
muxpreload=0
muxdelay_mode=override
muxdelay=0
max_interleave_delta_mode=override
max_interleave_delta=500000

; Mark a newly started/restarted TS as discontinuous.
mpegts_initial_discontinuity=true
; Re-emit PAT/PMT at each restarted Fixed stream boundary so ExoPlayer and
; Media3 can identify the new stream immediately after a SageTV FLUSH.
mpegts_resend_headers=true

; Preserve SageTV's -packetsize and -aspect if present.
packetsize_mode=inherit
aspect_mode=inherit

[arg_rules]
; Options handled by the MIM and never sent to stock FFmpeg.
remove=-stdinctrl,-activefile

; Legacy SageTV options that may need translation rather than direct passthrough.
; The native MIM should translate these before launching ffmpeg.real.
translate_legacy_crop=true
translate_broken_dts=true

[logging]
enabled=true
; Relative path resolves from MIM executable directory.
file=./ffmpeg.real.log
level=info
log_original_command=true
log_final_command=true
log_stdin_commands=true
; Mapped transcodes override SageTV's very-low numeric -v level so failures are visible.
; Set blank to preserve SageTV's original -v/-loglevel argument.
ffmpeg_transcode_loglevel=error
; On Linux, child stderr is tee'd to the original stderr and mirrored into this MIM log.
log_ffmpeg_stderr=true

[status]
; `ffmpeg --mim-status` returns JSON describing active and most recent jobs.
; Regression tests use backend/encoder/hardwareEncode here instead of inferring
; GPU use from host CPU utilization.
directory=cache/status
